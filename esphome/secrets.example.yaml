# Copy to secrets.yaml, next to nibe-gw.yaml, and fill in. git ignores secrets.yaml.

wifi_ssid: "your-network"
wifi_password: "your-wifi-password"

# The gateway's own network if it cannot join yours, at least 8 characters.
ap_password: "choose-a-password"
# 32 random bytes, base64: python3 -c "import base64,secrets;print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_encryption_key: "REPLACE-WITH-32-RANDOM-BYTES-BASE64"
ota_password: "choose-a-password"

# Hosts allowed to send read and write requests to the gateway.
ha_ip: "192.168.1.10"      # Home Assistant
dev_ip: "192.168.1.20"     # a computer for testing; the same as ha_ip if there is none

# nibe-<the pump's 14-digit serial>-gw, all lowercase. The serial is on the
# pump's rating plate. The integration reads model and build date from it.
device_name: "nibe-SERIAL-gw"
device_friendly_name: "NIBE F1255-16"
