# NibeGW gateway for NIBE F-series heat pumps, on a Waveshare ESP32-S3-RS485-CAN.
#
# The board sits on the pump's RS-485 accessory bus in place of a MODBUS 40.
# It acknowledges the pump's telegrams on its own, so a Home Assistant restart
# never leaves the pump without an answer, and it forwards what the pump sends
# over UDP to every host that has sent it a request in the last two minutes.
# It decodes nothing: that is the `nibe` library's job, through its NibeGW
# connection.
#
# Wiring, from Waveshare's schematic and NIBE's MODBUS 40 installer manual:
#   board RS485 A+  ->  pump AA3-X4:11 (A)
#   board RS485 B-  ->  pump AA3-X4:10 (B)
#   The board's RS-485 terminal has only A and B, and its RS-485 side is
#   galvanically isolated, so the pump's X4:9 (GND) stays unconnected.
#   Termination jumper H2: leave it as delivered, open.
#
# Pins, from Waveshare's schematic (GPIO table and RS485 sheet):
#   GPIO17  ->  TXD1      ->  isolator  ->  SP3485 DI
#   GPIO18  <-  RXD1      <-  isolator  <-  SP3485 RO
#   GPIO21  ->  RS485_EN  ->  isolator  ->  SP3485 DE and /RE, high = transmit
#
# First flash over USB-C:   esphome run nibe-gw.yaml
# Later updates go over Wi-Fi with the same command.
# Site-specific values live in secrets.yaml, which git ignores.

substitutions:
  # Network name and display name, both kept in secrets.yaml: the name carries
  # the pump's serial, which identifies a single machine, and this file is public.
  # The name follows the S-series pattern, nibe-<serial>, so the integration can
  # read the model and build date from it exactly as it does for those pumps.
  name: !secret device_name
  friendly_name: !secret device_friendly_name

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: NibeGW for NIBE F-series on a Waveshare ESP32-S3-RS485-CAN

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  # DEBUG logs every telegram, which is far too much on a bus that never pauses.
  level: INFO

api:
  # ESPHome restarts a device that no API client has connected to for fifteen
  # minutes. The integration talks to the gateway over UDP, not this API, so by
  # default the gateway restarted every quarter of an hour, leaving the pump
  # unanswered each time. Adding it to Home Assistant's ESPHome integration is
  # optional; this keeps it running either way.
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # esphome-nibe: with power saving on, the board misses UDP requests.
  power_save_mode: none
  # When the network cannot be joined, the board opens its own network,
  # and the captive portal below lets Wi-Fi be set from a phone.
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

external_components:
  - source: github://elupus/esphome-nibe
    components: [nibegw]

uart:
  id: nibe_bus
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 9600

nibegw:
  uart_id: nibe_bus
  # The SP3485 has no automatic direction control; nibegw raises this pin
  # for exactly as long as it transmits.
  dir_pin: GPIO21
  udp:
    # Only these hosts may send read and write requests. A write changes the
    # pump's settings, so keep this list short.
    source:
      - !secret ha_ip
      - !secret dev_ip
    # read_port 9999 and write_port 10000 are the defaults, and match the
    # defaults of the nibe library and Home Assistant's nibe_heatpump.
  acknowledge:
    - MODBUS40
  constants:
    # Answer the pump's accessory version request as a MODBUS 40 of version 10,
    # the same reply every esphome-nibe example uses.
    - address: MODBUS40
      token: ACCESSORY
      data: [0x0A, 0x00, 0x01]

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime

button:
  - platform: restart
    name: Restart
  - platform: safe_mode
    name: Safe mode boot
