name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest rules change independently of this repo, so re-run weekly.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests (nibe ${{ matrix.nibe }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Home Assistant container comes with the nibe its own
        # nibe_heatpump pins (2.24.0 in 2026.9, 2.25.0 in 2026.10), and the
        # manifest's nibe>=2.24.0 takes it as it is, so both are in use at
        # once. 2.24.0 is also the manifest's floor. "latest" is what Home
        # Assistant installs where it has none, and meets a new release here
        # before a user does: 2.25.0 renamed the F370/F470 map.
        nibe: ["2.24.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: ${{ matrix.nibe != 'latest' }}
        run: pip install pytest "nibe==${{ matrix.nibe }}"
      - if: ${{ matrix.nibe == 'latest' }}
        run: pip install pytest nibe
      - run: python -c "import nibe; print(nibe.__version__)"
      - run: pytest

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
